<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>EVV 2000 | Admin Login</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(34, 211, 238, 0.08) 0%, transparent 50%),
                var(--navy);
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--royal), var(--primary), var(--accent));
        }

        .login-logo { width: 80px; height: 80px; margin: 0 auto 16px; }
        .login-logo img { width: 100%; height: 100%; object-fit: contain; }

        .login-title { font-size: 1.75rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .login-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }

        .login-btn { width: 100%; padding: 14px; font-size: 1rem; margin-top: 8px; }

        .error-msg {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }

        .error-msg.visible { display: block; }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--accent); }
        .back-link i { margin-right: 6px; }

        @media (max-width: 480px) { .login-card { padding: 36px 24px; } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="../img/logo.svg" alt="EVV 2000 Logo">
        </div>
        <h1 class="login-title">Admin-Bereich</h1>
        <p class="login-subtitle">Melde dich an, um den Adminbereich zu nutzen.</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" class="form-input" placeholder="admin@evv2000.de" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" class="form-input" placeholder="Passwort eingeben" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Anmelden
            </button>
        </form>

        <form id="recoveryForm" style="display:none">
            <p style="color:var(--accent);font-size:0.85rem;margin-bottom:16px">
                <i class="fas fa-key"></i> Bitte lege ein neues Passwort fest.
            </p>
            <div class="form-group">
                <label for="newPassword">Neues Passwort (min. 8 Zeichen)</label>
                <input type="password" id="newPassword" class="form-input" placeholder="Neues Passwort" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary login-btn" id="recoveryBtn">
                <i class="fas fa-check"></i> Passwort speichern
            </button>
        </form>

        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Zur&uuml;ck zur Website
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>window.ERKA_API_BASE = 'https://erka-beach.vercel.app';</script>
    <script src="../js/supabase-client.js"></script>
    <script>
        var loginForm = document.getElementById('loginForm');
        var errorMsg = document.getElementById('errorMsg');
        var loginBtn = document.getElementById('loginBtn');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('visible');
        }

        // Passwort-Recovery-Link? (Supabase hängt #type=recovery an die URL)
        var isRecovery = (window.location.hash || '').indexOf('type=recovery') !== -1;

        if (isRecovery) {
            loginForm.style.display = 'none';
            document.getElementById('recoveryForm').style.display = '';
        }

        // Bereits eingeloggt? -> weiter zum Dashboard (nicht im Recovery-Modus)
        (async function () {
            if (isRecovery) { await ErkaSupabase.init(); return; }
            try {
                var user = await ErkaSupabase.getUser();
                if (user) window.location.href = 'dashboard.html';
            } catch (e) { /* nicht eingeloggt */ }
        })();

        document.getElementById('recoveryForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            errorMsg.classList.remove('visible');
            var pw = document.getElementById('newPassword').value;
            if (!pw || pw.length < 8) {
                showError('Das Passwort muss mindestens 8 Zeichen haben.');
                return;
            }
            var btn = document.getElementById('recoveryBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Speichern...';
            try {
                await ErkaSupabase.init();
                var res = await ErkaSupabase.client.auth.updateUser({ password: pw });
                if (res.error) throw res.error;
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error(err);
                showError(err.message || 'Passwort konnte nicht gespeichert werden. Link evtl. abgelaufen — bitte neue Reset-Mail anfordern.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Passwort speichern';
            }
        });

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorMsg.classList.remove('visible');

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Bitte E-Mail und Passwort eingeben.');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Anmelden...';

            try {
                var data = await ErkaSupabase.signIn(email, password);
                // Login im Aktivitätslog vermerken (schlägt bei Nicht-Admins leise fehl)
                try {
                    await ErkaSupabase.client.from('admin_audit_log').insert({
                        user_id: data.user ? data.user.id : null,
                        user_email: email,
                        action: 'login',
                        entity: 'session'
                    });
                } catch (ignored) {}
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error('Login error:', err);
                if (err.message === 'Demo-Modus') {
                    showError('Login im Demo-Modus nicht verfügbar. Bitte auf dem Server deployen.');
                } else if ((err.message || '').includes('Invalid login credentials')) {
                    showError('Ungültige E-Mail oder Passwort.');
                } else {
                    showError(err.message || 'Anmeldung fehlgeschlagen.');
                }
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Anmelden';
            }
        });
    </script>
</body>
</html>
